name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npx playwright test --config playwright.canvas.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npx playwright test --config playwright.boards.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run test:workflow-graph
      - run: npx playwright test --config playwright.workflows.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
